<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Cloud Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f4f7fb;
    }

    button {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 15px auto;
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>Nova Cloud</h1>

  <p>Button Test</p>

  <button onclick="testButton('Systems')">
    ⚙️ Systems
  </button>

  <button onclick="testButton('Business')">
    🧠 Business
  </button>

  <button onclick="testButton('Research')">
    🔎 Research
  </button>

  <button onclick="testButton('Data & Analysis')">
    📊 Data & Analysis
  </button>

  <button onclick="testButton('Cloud Workspace')">
    ☁️ Cloud Workspace
  </button>

  <div id="result">
    Tap a button.
  </div>

  <script>
    function testButton(name) {
      document.getElementById("result").innerHTML =
        "<strong>You opened:</strong><br><br>" + name;
    }
  </script>

</body>
</html>
